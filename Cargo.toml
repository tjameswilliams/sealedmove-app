[workspace]
resolver = "2"
members = [
    "crates/coach-core",
    "crates/coach-cli",
    "crates/coach-ffi",
    # GPL-3.0-only leaf (links Stockfish) — see its README before shipping.
    "crates/stockfish-embedded",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
