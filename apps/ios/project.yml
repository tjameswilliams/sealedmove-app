name: TeachMeChess
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
targets:
  TeachMeChess:
    type: application
    platform: iOS
    sources:
      # Configuration.storekit is scheme metadata (local StoreKit testing),
      # not an app resource — keep it out of the bundle.
      - path: TeachMeChess
        excludes:
          - Configuration.storekit
    # Config.xcconfig optionally pulls in the gitignored signing.xcconfig
    # (DEVELOPMENT_TEAM for running on a physical device — see README's
    # "Run on your iPhone"). Simulator builds work fine without it.
    #
    # NOTE: xcodegen (as of 2.46) has no `optional:` flag on spec includes —
    # a missing included yml is a hard parse error — so the optional signing
    # file is an xcconfig reached through xcconfig's native `#include?`
    # directive instead of an xcodegen include.
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    dependencies:
      # Rust core (static lib + coach_ffiFFI clang module), built by
      # scripts/build-ios-xcframework.sh
      - framework: Frameworks/CoachFFI.xcframework
        embed: false
      # Required by the Rust static lib (reqwest/native-tls uses the
      # Security framework on Apple platforms).
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      # The Rust static lib now embeds Stockfish 11 (C++) — link the C++
      # runtime.
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.teachmechess.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Sealed Move"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # HTTPS-only networking -> exempt encryption; declaring it here
        # skips the export-compliance question on every upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Automatic signing for device runs; the DEVELOPMENT_TEAM comes from
        # the optional gitignored signing.xcconfig (via Config.xcconfig).
        # Simulator builds ad-hoc sign (no team needed): entirely unsigned
        # binaries carry no entitlements, and the simulator keychain then
        # rejects every SecItem call with errSecMissingEntitlement (-34018).
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TeachMeChess/TeachMeChess.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        # The Rust simulator slice is arm64-only (Apple Silicon).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
# Explicit schemes (xcodegen stops auto-generating one once a schemes:
# block exists). Build/run/test configs mirror the auto-generated defaults.
#
# The local StoreKit configuration lives ONLY on the -LocalStore scheme:
# installing through a scheme that carries it leaves a PERSISTENT StoreKit
# test session on the device/simulator — even home-screen launches keep
# buying from the local store (environment "Xcode", transactions the
# backend rightly rejects) until the app is deleted. The default scheme
# therefore stays config-free so device installs talk to the real App
# Store sandbox; use -LocalStore for offline purchase-UI work, and delete
# the app when switching back.
schemes:
  TeachMeChess:
    build:
      targets:
        TeachMeChess: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  TeachMeChess-LocalStore:
    build:
      targets:
        TeachMeChess: all
    run:
      config: Debug
      # xcodegen Scheme Run option `storeKitConfiguration` (>= 2.20);
      # path is relative to the project directory.
      storeKitConfiguration: TeachMeChess/Configuration.storekit
    test:
      config: Debug
